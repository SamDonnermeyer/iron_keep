version: 2

models:
  - name: mart_person_engagement
    description: Person-level engagement summary across all platforms - check-ins, discipleship, group participation
    columns:
      - name: person_id
        description: Unified person ID (pco_person_id or es_user_id for ES-only)
        tests:
          - not_null

  - name: mart_campus_summary
    description: Campus-level summary with group counts and location details
    columns:
      - name: pco_campus_id
        description: Primary key from Planning Center
        tests:
          - unique
          - not_null

  - name: mart_village_summary
    description: Village/group-level summary with member counts and campus attribution
    columns:
      - name: es_group_id
        description: Primary key from Engage Spaces
        tests:
          - unique
          - not_null

  - name: mart_attendance_trends
    description: Weekly attendance trends combining headcounts and individual check-ins
    columns:
      - name: week_start
        description: Start of the week (Monday)
        tests:
          - unique
          - not_null

  - name: mart_village_attendance
    description: >
      Village health over time — one row per village per gathering date with
      attendance rate, trailing average and gap-since-last-meeting. Keyed on the
      Shepherding village_id with real recorded attendance, unlike
      mart_village_summary which infers ES group membership from a name substring.
    columns:
      - name: village_gathering_sk
        description: Primary key — one row per village per gathering date
        tests:
          - unique
          - not_null
      - name: village_id
        tests:
          - not_null
      - name: gathering_date
        tests:
          - not_null

  - name: mart_village_member_engagement
    description: >
      Person-level engagement within a village — attendance rate, consecutive
      misses and a drift signal, measured only against gatherings the member was
      eligible for.
    columns:
      - name: person_local_id
        description: Primary key from the Shepherding roster
        tests:
          - unique
          - not_null
      - name: village_id
        tests:
          - not_null
      - name: engagement_status
        description: engaged | watch | drifting | retired | no_data. Thresholds are placeholders pending team input.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['engaged', 'watch', 'drifting', 'retired', 'no_data']
